# ── plex-forward-auth · paste into a proxy host's "Advanced" tab ──────────────
# Protects this host with a single "Sign in with Plex". Works by setting
# auth_request at the SERVER level so it is INHERITED by NPM's auto-generated
# `location /` — we never redefine `location /`, so there is no conflict with
# Nginx Proxy Manager's own config.
#
# Replace `auth.example.com` with your auth subdomain and `plex-forward-auth:8056`
# with the gateway's address reachable from the NPM container (same docker network).

auth_request /__plexauth;
error_page 401 = @__plexauth_login;

# auth sub-request -> the gateway's /verify (internal: not reachable from outside)
location = /__plexauth {
    internal;
    auth_request off;
    proxy_pass              http://plex-forward-auth:8056/verify;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_set_header        X-Original-URI  $request_uri;
    proxy_set_header        X-Original-Host $host;
    proxy_set_header        X-Real-IP       $remote_addr;
    proxy_set_header        X-Forwarded-For $remote_addr;
}

# on 401 send the browser to the Plex sign-in, remembering where it was going
location @__plexauth_login {
    auth_request off;
    return 302 https://auth.example.com/login?rd=https://$host$request_uri;
}
